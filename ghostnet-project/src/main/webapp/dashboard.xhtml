<?xml version='1.0' encoding='UTF-8'?>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

     <h:head>
        <title>Ghostnet Shea Sepherd</title>
        <link rel="stylesheet" type="text/css" media="screen" href="#{request.contextPath}/styles.css" />
    </h:head>


    <h:body>
    
    <f:metadata>
    <f:event type="preRenderView" listener="#{dashboardController.init}" />
	</f:metadata>
    
    
        <div class="main-container">

 			<!-- Logo -->
			<img class="logo" src="#{request.contextPath}/media/sheaSepherdLogo.svg" alt="Shea Sepherd Logo" />
 	    
 	    
 	    
     
     
            <!-- Title and Subtitle -->
            <h2 class="home-title">Shea Sepherd</h2>
			<h3 class="home-subtitle">Übersicht über alle gemeldeten Geisternetze</h3>
	
	
		<h:form>
		
			
			<p:dataTable var="ghostnet" value="#{ghostnetController.allSavedGhostnets}"  stripedRows="true" styleClass="ghostnet-table">
			
				<p:column>
    				<f:facet name="header">Gesichtet am</f:facet>
    				<p:outputLabel value="#{ghostnet.reportedAt}" pattern="dd.MM.yyyy">
    				</p:outputLabel>
				</p:column>
			
				<p:column>
					<f:facet name="header">Latitude</f:facet>
					<p:outputLabel value="#{ghostnet.latitude}"/>
				</p:column>
			
				<p:column>
					<f:facet name="header">Longitude</f:facet>
					<p:outputLabel value="#{ghostnet.longitude}"/>
				</p:column>
			
				<p:column>
					<f:facet name="header">Größe</f:facet>
					<p:outputLabel value="#{ghostnet.size}"/>
				</p:column>
		
				<p:column>
					<f:facet name="header">Status</f:facet>
					
					<div class="status-text">
					<p:outputLabel value="#{ghostnet.status.displayName}"
					styleClass="#{ghostnet.status.name().toLowerCase()}-status" />
					</div>
					
					<div class="button-group">
					
					<p:commandButton 
						value="Bergen"  
						rendered="#{ghostnet.assignedTo == null}"
	                    action="#{ghostnetController.assignToUser(ghostnet)}"
	                    update="@form" 
	                    styleClass="rounded-button bergen-button"/>
					
					
					<p:commandButton 
						value="Geborgen" 
						rendered="#{ghostnet.assignedTo == loginController.currentUser and ghostnet.status == 'BERGUNG_BEVORSTEHEND'}"
	                    action="#{ghostnetController.markAsRecovered(ghostnet)}"
	                    update="@form"
						styleClass="rounded-button geborgen-button" />
						
					
					<p:commandButton  value="Verschollen" 
						rendered="#{ghostnet.assignedTo == loginController.currentUser and ghostnet.status == 'BERGUNG_BEVORSTEHEND'}"
	                    action="#{ghostnetController.markAsLost(ghostnet)}"
	                    update="@form"
						styleClass="rounded-button verschollen-button" />
						
					
					 <p:commandButton 
					  	value="Show"
					  	rendered="#{ghostnet.assignedTo != null and ghostnet.assignedTo != loginController.currentUser}"
					 	icon="pi pi-user"
    					update="@form"
					 	id="basic" 
					 	type="button"
					 	styleClass="kontakt-button"/>
					 	
        				<p:overlayPanel for="basic" style="width:350px">
        				
        					<h:panelGrid columns="2" cellpadding="6">
        				
           			 	  	<h:outputText value="Name:" />
        					<h:outputText value="#{ghostnet.assignedTo.firstName} #{ghostnet.assignedTo.name}" />

					        <h:outputText value="E-Mail:" />
					        <h:outputText value="#{ghostnet.assignedTo.email}" />
					
					        <h:outputText value="Telefon:" />
					        <h:outputText value="#{ghostnet.assignedTo.phonenumber}" />
					        
					        </h:panelGrid>

        				</p:overlayPanel>	
        			</div>			
					
				</p:column>
		
		
			</p:dataTable>
			
			
			
			
			</h:form>
			
			  	<div class="button-container"> 
	
					<h:form>
		            	<p:commandButton value="Geisternetz melden" action="#{controller.goToReport}" styleClass="button-main"/>
					</h:form>
	       
		         	<h:form>
		            	<p:commandButton value="Ausloggen" action="#{loginController.logout}" rendered="#{loginController.loggedIn}" styleClass="button-main"/>
				   	</h:form>
				   
            	</div>
		    
        </div>
        
        
       
        
  
        
        
        
    </h:body>

</html>
